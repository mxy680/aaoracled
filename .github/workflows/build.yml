# Build the combined aaoracled .deb (the OracledDCPatch tweak + the
# aaoracled CLI/daemon) the way SETUP.md step 9 describes a Linux build:
# roothide's theos fork, the prebuilt L1ghtmann iOS toolchain, and the
# patched iPhoneOS 16.5 SDK that the Makefile's
# `TARGET = iphone:clang:16.5:15.0` asks for. Packaging itself is delegated
# to the repo's own build_and_sign.sh, so CI and a local build take the
# same code path.
#
# This proves only that the project compiles and packages. It cannot
# validate the result: Tweak.x hooks AppAttestInternal at hardcoded,
# Ghidra-derived offsets that are valid for exactly one dyld_shared_cache
# build (iPad mini 4, iPadOS 15.8.8 / 19H422), and nothing here touches a
# device.
#
# On a `v*` tag the `publish` job additionally ships the built .deb to the
# Nexus apt repository that serves it to SRDs. See that job for the Nexus
# specifics; the short version is that apt hosted repos take uploads through
# the components REST API (not HTTP PUT), Nexus signs the Release file with a
# key held repository-side (so no GPG material lives here), and the repo is
# configured immutable, so a version can be published exactly once.
name: Build

on:
  push:
    branches: [master]
    # Publishing is tag-driven: pushing master repeatedly would otherwise
    # re-attempt the same version, which an immutable repo rejects anyway.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # theos ships one SDK per iOS version; the Makefile targets 16.5.
  SDK: iPhoneOS16.5
  # Bump to force a cold rebuild of the cached theos install — both the
  # toolchain and the SDK come from rolling "latest" releases.
  THEOS_CACHE_VERSION: v1

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure theos location
        # Outside the workspace, so actions/checkout's clean step never
        # walks it and the cache restores independently of the checkout.
        run: echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # The Debian set from roothide theos' own bin/install-theos, plus
          # libtinfo6 (the non-Swift prebuilt toolchain links against it) and
          # libplist-2.0-4 (FINALPACKAGE=1 runs theos' convert_xml_plist.sh,
          # which calls the toolchain's dynamically linked plistutil).
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl zip git libxml2 \
            libtinfo6 libplist-2.0-4 xz-utils dpkg-dev

      - name: Cache theos (toolchain + SDK)
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-${{ runner.os }}-${{ runner.arch }}-${{ env.SDK }}-${{ env.THEOS_CACHE_VERSION }}

      - name: Install theos (roothide fork)
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          # The roothide fork is what provides THEOS_PACKAGE_SCHEME=roothide,
          # which the Makefile exports; upstream theos cannot build this.
          rm -rf "$THEOS"
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"

      - name: Install iOS toolchain
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$THEOS/toolchain"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-$(uname -m).tar.xz" \
            | tar -xJf - -C "$THEOS/toolchain/"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          # build_and_sign.sh refuses to run without ldid on PATH, and puts
          # this directory on it — the toolchain ships the binary.
          test -x "$THEOS/toolchain/linux/iphone/bin/ldid"

      - name: Install ${{ env.SDK }} SDK
        if: steps.theos-cache.outputs.cache-hit != 'true'
        env:
          # install-sdk reads the release list off the GitHub API; auth
          # keeps it clear of the unauthenticated rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$THEOS/bin/install-sdk" "$SDK"
          test -d "$THEOS/sdks/$SDK.sdk"

      - name: Build package
        env:
          # Release build, so the .deb carries the plain version from
          # `control`. A debug build appends theos' auto-incrementing build
          # counter, which is meaningless on an ephemeral runner.
          FINALPACKAGE: "1"
        run: ./build_and_sign.sh

      - name: Inspect built package
        run: |
          DEB="$(find packages -maxdepth 1 -name '*.deb' | sort -V | tail -1)"
          [ -n "$DEB" ] || { echo "::error::no .deb was produced"; exit 1; }
          echo "::notice::built $(basename "$DEB")"
          # theos packages with dpkg-deb when it is installed and falls back
          # to its own dm.pl otherwise; dm.pl emits data.tar.lzma, which
          # current dpkg-deb cannot read, so degrade to `ar` rather than
          # failing the build over the smoke check.
          if ! { dpkg-deb -I "$DEB" && dpkg-deb -c "$DEB"; }; then
            echo "::warning::dpkg-deb could not read the package; listing members instead"
            ar t "$DEB"
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: aaoracled-deb
          path: packages/*.deb
          if-no-files-found: error

  # Ship the tagged build to the Nexus apt repository that SRDs install from.
  #
  # Gated on refs/tags/v* rather than on a branch, which is also what keeps
  # the credential away from fork pull requests: a PR can never satisfy this
  # condition, so it can never reach the `nexus-ios` environment the secrets
  # are scoped to.
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nexus-ios

    env:
      # Both of these are already public (the repo is anonymously readable and
      # the install URL is in the README), so they are plain config, not
      # secrets. Only the deploy credential is sensitive.
      NEXUS_BASE: https://repo.regulad.xyz
      NEXUS_REPO: ios
      NEXUS_DIST: stable
      PKG: xyz.regulad.aaoracled

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Tag must match the packaged version
        # The version SRDs receive comes from `control`, not from the tag, and
        # openapi.yaml's contract version is kept in step with it. A mismatch
        # would publish something whose version disagrees with the thing that
        # named it, which an immutable repo then makes permanent.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CTRL="$(awk -F': ' '/^Version:/{print $2; exit}' control | tr -d '\r')"
          API="$(awk -F': ' '/^  version:/{print $2; exit}' openapi.yaml | tr -d '\r')"
          echo "tag=$TAG control=$CTRL openapi=$API"
          [ "$TAG" = "$CTRL" ] || { echo "::error::tag v$TAG != control Version: $CTRL"; exit 1; }
          [ "$TAG" = "$API" ] || { echo "::error::tag v$TAG != openapi info.version: $API"; exit 1; }

      - name: Download the built package
        uses: actions/download-artifact@v4
        with:
          name: aaoracled-deb
          path: dist

      - name: Resolve and sanity-check the .deb
        id: deb
        run: |
          DEB="$(find dist -maxdepth 1 -name '*.deb' | sort -V | tail -1)"
          [ -n "$DEB" ] || { echo "::error::no .deb in the build artifact"; exit 1; }
          # theos appends an incrementing suffix to non-FINALPACKAGE builds.
          # Such a version must never reach the public repo.
          case "$DEB" in
            *+debug*) echo "::error::refusing to publish a debug build: $DEB"; exit 1 ;;
          esac
          echo "path=$DEB" >> "$GITHUB_OUTPUT"
          echo "::notice::publishing $(basename "$DEB")"

      - name: Refuse to clobber an already-published version
        # The repository is immutable (the deploy role deliberately has no
        # -edit privilege), so a duplicate would fail server-side regardless.
        # Checking first turns that into a clear message instead of a 400 from
        # the middle of an upload, and validates the credential before we rely
        # on it.
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          N="$(curl -fsS -u "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
                "$NEXUS_BASE/service/rest/v1/search?repository=$NEXUS_REPO&name=$PKG&version=$V" \
                | jq '.items | length')"
          echo "existing components for $PKG $V: $N"
          [ "$N" -eq 0 ] || {
            echo "::error::$PKG $V is already published; bump the version rather than re-tagging"
            exit 1
          }

      - name: Upload to Nexus
        # apt hosted repositories do not accept direct HTTP PUT (unlike
        # maven2/raw/yum) — the supported route is a multipart POST to the
        # components API with the format-specific `apt.asset` field. A
        # successful upload is 204 No Content, with no body.
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          CODE="$(curl -sS -o resp.txt -w '%{http_code}' \
            -u "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            -X POST "$NEXUS_BASE/service/rest/v1/components?repository=$NEXUS_REPO" \
            -H 'accept: application/json' \
            -F "apt.asset=@${{ steps.deb.outputs.path }}")"
          echo "HTTP $CODE"
          head -c 2000 resp.txt || true
          echo
          case "$CODE" in
            204) echo "::notice::upload accepted" ;;
            500) echo "::error::500 — check the repository's PGP signing key (AptSigningFacet)"; exit 1 ;;
            40*) echo "::error::$CODE — credential or privilege problem, or duplicate version"; exit 1 ;;
            *)   echo "::error::unexpected HTTP $CODE"; exit 1 ;;
          esac

      - name: Verify it is actually installable
        # A 204 means "stored", not "installable": Nexus rebuilds the apt
        # indexes asynchronously after an upload, so the only thing that
        # proves an SRD can see the package is the Packages index itself.
        # Components/architectures are read out of Release rather than
        # assumed, so this keeps working if either changes.
        run: |
          V="${GITHUB_REF_NAME#v}"
          ROOT="$NEXUS_BASE/repository/$NEXUS_REPO/dists/$NEXUS_DIST"

          fetch_packages() {
            curl -fsS "$1/Packages" 2>/dev/null && return 0
            curl -fsS "$1/Packages.gz" 2>/dev/null | gunzip -c 2>/dev/null && return 0
            return 1
          }

          for attempt in $(seq 1 12); do
            REL="$(curl -fsS "$ROOT/Release" 2>/dev/null || true)"
            if [ -n "$REL" ]; then
              COMPS="$(echo "$REL" | awk -F': ' '/^Components:/{print $2; exit}')"
              ARCHS="$(echo "$REL" | awk -F': ' '/^Architectures:/{print $2; exit}')"
              echo "attempt $attempt: components=[$COMPS] architectures=[$ARCHS]"
              for c in $COMPS; do
                for a in $ARCHS; do
                  if fetch_packages "$ROOT/$c/binary-$a" \
                       | grep -A25 "^Package: $PKG$" \
                       | grep -q "^Version: $V$"; then
                    echo "::notice::$PKG $V live in $NEXUS_DIST/$c/binary-$a"
                    exit 0
                  fi
                done
              done
            else
              echo "attempt $attempt: Release not readable yet"
            fi
            sleep 10
          done

          echo "::error::uploaded but $PKG $V never appeared in the apt index (2 min)"
          exit 1
